<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
  @import url('https://fonts.googleapis.com/icon?family=Material+Icons');

  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --text: #2c3e50;
    --accent: #3498db;
    --accent-hover: #2980b9;
    --border: #d0d7e2;
    --highlight: yellow;
    --shadow: 0 4px 10px #0002;
  }

  /* MODO ESCURO */
  [data-theme="dark"] {
    --bg: #1e1e1e;
    --panel: #2a2a2a;
    --text: #e0e0e0;
    --accent: #5dade2;
    --accent-hover: #3498db;
    --border: #444;
    --highlight: #ffeb3b;
    --shadow: 0 4px 12px #0005;
  }

  body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
    animation: fadeIn 0.6s ease;
  }

  .panel {
    background: var(--panel);
    padding: 20px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 25px;
    animation: fadeIn 0.4s ease;
  }

  textarea, input[type="text"], select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 12px;
    background: var(--panel);
    color: var(--text);
    transition: 0.3s;
  }

  textarea:focus, input:focus, select:focus {
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 2px var(--accent + 33);
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    transition: 0.25s;
  }

  button:hover {
    background: var(--accent-hover);
    transform: translateY(-2px);
  }

  .list, .results {
    border: 1px solid var(--border);
    padding: 12px;
    max-height: 240px;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 10px;
    animation: fadeIn 0.4s ease;
  }

  .highlight {
    background: var(--highlight);
    font-weight: bold;
  }

  .text-block {
    margin-bottom: 15px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 10px;
  }

  #themeToggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--accent);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: var(--shadow);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
