<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #eef2f7;
    color: #333;
  }

  h1 {
    margin-bottom: 20px;
    text-align: center;
    color: #2c3e50;
  }

  .panel {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px #0002;
    margin-bottom: 25px;
  }

  textarea {
    width: 100%;
    min-height: 140px;
    border-radius: 8px;
    border: 1px solid #ccc;
    padding: 10px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
  }

  button {
    background: #3498db;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 8px;
    transition: 0.2s;
  }

  button:hover {
    background: #2980b9;
  }

  .list {
    border: 1px solid #ddd;
    padding: 10px;
    max-height: 220px;
    overflow-y: auto;
    background: #fafafa;
    border-radius: 8px;
  }

  .results {
    border: 1px solid #ddd;
    padding: 10px;
    max-height: 260px;
    overflow-y: auto;
    background: #fafafa;
    border-radius: 8px;
  }

  .highlight {
    background: yellow;
    font-weight: bold;
  }

  .text-block {
    margin-bottom: 15px;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 10px;
  }

  #iframeWarning {
    background: #ffdddd;
    padding: 10px;
    border: 1px solid #cc0000;
    margin-bottom: 20px;
    display: none;
    border-radius: 8px;
  }
</style>
